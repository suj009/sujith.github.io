<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Order Ticket — Lab · Sujith Kumar Anand</title>
<meta name="description" content="A live trading-panel component: real-time watchlist and an order ticket with hold-to-confirm. Designed and built in the browser." />

<!--
  LAB PIECE 01 — Order Ticket
  A self-contained, dependency-free trading component for the Lab.

  Why this piece: it demonstrates, in one clickable artifact, the four things
  the Options Scalper case study talks about — density, speed, real-time
  state, and error-prevention — in the clean/compact language the FDSG story
  describes. It's the proof layer for "a design leader who still ships."

  Notes for Sujith:
  - Data is SIMULATED (public ticker names, random walk prices). No real feed,
    nothing FYERS-confidential. Swap in your own styling/tokens to match your
    system, or leave it neutral as a standalone demo.
  - Signature interaction: press-and-HOLD "Place order" to confirm — error
    prevention at speed, made literal. Keyboard users get an accessible
    two-step confirm.
  - One file. Host it anywhere (Vercel/Netlify/GitHub Pages) as a Lab entry.
-->

<link rel="icon" href="img/logo-s.svg" type="image/svg+xml" />
<link rel="icon" href="img/logo-s-512.png" type="image/png" sizes="512x512" />
<link rel="apple-touch-icon" href="img/logo-s-512.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
  :root{
    --bg:#0C0E13;
    --panel:#141821;
    --panel-2:#1A1F2A;
    --line:#262C39;
    --line-soft:#1E232E;
    --text:#E6E9EF;
    --muted:#8A93A6;
    --faint:#5B6478;
    --up:#35C08A;
    --up-dim:rgba(53,192,138,.14);
    --down:#EF5F6B;
    --down-dim:rgba(239,95,107,.14);
    --focus:#5E8BFF;
    --radius:14px;
    --ease:cubic-bezier(.22,.61,.36,1);
    --side:var(--up);          /* recolors with Buy/Sell */
    --side-dim:var(--up-dim);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1100px 700px at 78% -10%, rgba(94,139,255,.06), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:"Hanken Grotesk",system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100%;padding:32px 20px;gap:18px;
    -webkit-font-smoothing:antialiased;
  }
  .num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

  /* caption above the component */
  .cap{width:100%;max-width:720px;display:flex;align-items:baseline;justify-content:space-between;gap:16px}
  .cap .ey{font-family:"IBM Plex Mono",monospace;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
  .cap h1{font-size:1.02rem;font-weight:600;letter-spacing:-.01em}
  .cap h1 span{color:var(--muted);font-weight:400}

  /* the component shell */
  .terminal{
    width:100%;max-width:720px;background:var(--panel);
    border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;display:grid;grid-template-columns:1.05fr 1fr;
    box-shadow:0 24px 60px -30px rgba(0,0,0,.7);
  }

  /* ---------------- watchlist ---------------- */
  .watch{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
  .whead{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--line-soft)}
  .whead .t{font-size:.82rem;font-weight:600;color:var(--muted);letter-spacing:.02em}
  .live{display:inline-flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",monospace;font-size:.64rem;letter-spacing:.14em;color:var(--faint);text-transform:uppercase}
  .live .pip{width:6px;height:6px;border-radius:50%;background:var(--up);box-shadow:0 0 8px var(--up);animation:pip 2s ease-in-out infinite}
  @keyframes pip{50%{opacity:.35}}

  .rows{display:flex;flex-direction:column;padding:6px}
  .row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;
    padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid transparent;
    transition:background .18s var(--ease),border-color .18s var(--ease)}
  .row:hover{background:var(--panel-2)}
  .row[aria-selected="true"]{background:var(--panel-2);border-color:var(--line)}
  .row:focus-visible{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px rgba(94,139,255,.22)}
  .row .sym{font-weight:600;font-size:.9rem;letter-spacing:.01em}
  .row .ex{font-size:.68rem;color:var(--faint);margin-top:1px}
  .row .px{text-align:right;font-size:.9rem;font-weight:500;transition:color .25s}
  .row .chg{grid-column:2;text-align:right;font-size:.72rem}
  .up{color:var(--up)} .down{color:var(--down)}
  .flash-up{animation:fu .5s var(--ease)} .flash-down{animation:fd .5s var(--ease)}
  @keyframes fu{0%{background:var(--up-dim)}100%{background:transparent}}
  @keyframes fd{0%{background:var(--down-dim)}100%{background:transparent}}

  /* mini sparkline */
  .spark{grid-column:1 / -1;height:0;opacity:0;transition:all .3s var(--ease);overflow:hidden}
  .row[aria-selected="true"] .spark{height:26px;opacity:1;margin-top:6px}
  .spark svg{width:100%;height:26px;display:block}

  /* ---------------- order ticket ---------------- */
  .ticket{display:flex;flex-direction:column;min-width:0}
  .thead{padding:13px 16px;border-bottom:1px solid var(--line-soft);display:flex;align-items:baseline;justify-content:space-between}
  .thead .t{font-size:.82rem;font-weight:600;color:var(--muted)}
  .thead .sel{font-family:"IBM Plex Mono",monospace;font-size:.82rem;font-weight:600}
  .tbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:13px}

  /* buy/sell segmented */
  .side{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px}
  .side button{appearance:none;border:none;background:none;color:var(--muted);font:inherit;font-weight:600;
    font-size:.86rem;padding:9px;border-radius:7px;cursor:pointer;transition:all .18s var(--ease)}
  .side button:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(94,139,255,.25)}
  .side button[data-on="true"][data-side="buy"]{background:var(--up-dim);color:var(--up)}
  .side button[data-on="true"][data-side="sell"]{background:var(--down-dim);color:var(--down)}

  .field{display:flex;flex-direction:column;gap:6px}
  .field > label{font-size:.72rem;color:var(--muted);letter-spacing:.02em;display:flex;justify-content:space-between}
  .field label .hint{color:var(--faint)}

  .stepper,.seg,.pricewrap{display:flex;align-items:stretch;background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .stepper button{width:42px;border:none;background:none;color:var(--muted);font-size:1.1rem;cursor:pointer;transition:background .15s,color .15s}
  .stepper button:hover{background:var(--panel-2);color:var(--text)}
  .stepper input,.pricewrap input{flex:1;min-width:0;background:none;border:none;color:var(--text);
    text-align:center;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:.95rem;padding:11px 8px}
  .stepper input:focus,.pricewrap input:focus{outline:none}
  .stepper:focus-within,.pricewrap:focus-within,.seg:focus-within{border-color:var(--focus);box-shadow:0 0 0 3px rgba(94,139,255,.18)}
  .pricewrap{padding-left:12px;align-items:center}
  .pricewrap .cur{color:var(--faint);font-family:"IBM Plex Mono",monospace;font-size:.9rem}
  .pricewrap input{text-align:left;padding-left:6px}
  .pricewrap[data-disabled="true"]{opacity:.5}

  .seg{padding:4px}
  .seg button{flex:1;border:none;background:none;color:var(--muted);font:inherit;font-weight:500;font-size:.82rem;padding:8px;border-radius:7px;cursor:pointer;transition:all .15s}
  .seg button[data-on="true"]{background:var(--panel-2);color:var(--text)}
  .seg button:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(94,139,255,.25)}

  .estimate{display:flex;align-items:baseline;justify-content:space-between;padding:2px 2px 0}
  .estimate .l{font-size:.76rem;color:var(--muted)}
  .estimate .v{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:1.05rem;font-weight:600}

  /* hold-to-confirm place button */
  .place{position:relative;border:1px solid var(--side);background:var(--side-dim);color:var(--side);
    font:inherit;font-weight:700;font-size:.95rem;letter-spacing:.01em;padding:14px;border-radius:11px;
    cursor:pointer;overflow:hidden;transition:opacity .2s,border-color .2s;user-select:none;-webkit-user-select:none}
  .place:disabled{opacity:.4;cursor:not-allowed}
  .place .fill{position:absolute;inset:0;background:var(--side);opacity:.9;width:0;
    transition:width .06s linear}
  .place .lab{position:relative;z-index:2;transition:color .1s}
  .place[data-holding="true"] .lab{color:var(--bg)}
  .place .hintline{position:relative;z-index:2;display:block;font-family:"IBM Plex Mono",monospace;
    font-weight:400;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;opacity:.7;margin-top:3px}
  .place[data-holding="true"] .hintline{color:var(--bg)}
  .place:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(94,139,255,.3)}

  /* toast */
  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,140%);z-index:50;
    display:flex;align-items:center;gap:12px;background:var(--panel-2);border:1px solid var(--line);
    border-left:3px solid var(--side);border-radius:11px;padding:12px 16px;min-width:280px;
    box-shadow:0 20px 50px -20px rgba(0,0,0,.7);transition:transform .4s var(--ease)}
  .toast[data-show="true"]{transform:translate(-50%,0)}
  .toast .dot{width:8px;height:8px;border-radius:50%;background:var(--side);flex:none}
  .toast .msg{font-size:.86rem}
  .toast .msg b{font-family:"IBM Plex Mono",monospace;font-weight:600}
  .toast .msg .sub{display:block;color:var(--muted);font-size:.74rem;margin-top:1px}

  .footnote{width:100%;max-width:720px;text-align:center;font-size:.72rem;color:var(--faint);line-height:1.5}
  .footnote b{color:var(--muted);font-weight:500}

  /* responsive */
  @media(max-width:620px){
    .terminal{grid-template-columns:1fr}
    .watch{border-right:none;border-bottom:1px solid var(--line)}
    .rows{max-height:210px;overflow-y:auto}
  }
  @media(prefers-reduced-motion:reduce){
    *{animation:none!important}
    .place .fill{transition:width .12s linear}
  }
</style>
</head>
<body>

  <div class="cap">
    <span class="ey">Lab / 01</span>
    <h1>Order Ticket <span>· real-time panel, built in the browser</span></h1>
  </div>

  <main class="terminal" aria-label="Trading order panel">
    <!-- watchlist -->
    <section class="watch" aria-label="Watchlist">
      <div class="whead">
        <span class="t">Watchlist</span>
        <span class="live"><span class="pip"></span>Live</span>
      </div>
      <div class="rows" id="rows" role="listbox" aria-label="Instruments"></div>
    </section>

    <!-- order ticket -->
    <section class="ticket" aria-label="Order ticket">
      <div class="thead">
        <span class="t">Order</span>
        <span class="sel num" id="selSym">—</span>
      </div>
      <div class="tbody">
        <div class="side" role="group" aria-label="Side">
          <button data-side="buy" data-on="true" id="buyBtn">Buy</button>
          <button data-side="sell" data-on="false" id="sellBtn">Sell</button>
        </div>

        <div class="field">
          <label for="qty">Quantity <span class="hint">lots</span></label>
          <div class="stepper">
            <button type="button" id="qtyMinus" aria-label="Decrease quantity">−</button>
            <input id="qty" class="num" inputmode="numeric" value="50" aria-label="Quantity" />
            <button type="button" id="qtyPlus" aria-label="Increase quantity">+</button>
          </div>
        </div>

        <div class="field">
          <label>Order type</label>
          <div class="seg" role="group" aria-label="Order type">
            <button id="mktBtn" data-on="true">Market</button>
            <button id="lmtBtn" data-on="false">Limit</button>
          </div>
        </div>

        <div class="field">
          <label for="price">Price <span class="hint" id="priceHint">at market</span></label>
          <div class="pricewrap" id="priceWrap" data-disabled="true">
            <span class="cur">₹</span>
            <input id="price" class="num" inputmode="decimal" value="0.00" aria-label="Limit price" disabled />
          </div>
        </div>

        <div class="estimate">
          <span class="l">Est. value</span>
          <span class="v num" id="estVal">₹0.00</span>
        </div>

        <button class="place" id="place" aria-label="Hold to place order">
          <span class="fill" id="fill"></span>
          <span class="lab" id="placeLab">Buy 50 —</span>
          <span class="hintline">Hold to confirm</span>
        </button>
      </div>
    </section>
  </main>

  <p class="footnote">
    <b>Simulated data</b> — public ticker names, random-walk prices, no live feed.
    Press and <b>hold</b> the order button to confirm: error-prevention at speed, made literal.
  </p>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <span class="dot"></span>
    <span class="msg" id="toastMsg"></span>
  </div>

<script>
(function(){
  "use strict";
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---- simulated instruments (public names, fake prices) ----
  const inst = [
    {sym:"NIFTY",    ex:"Index",  px:24380.50},
    {sym:"BANKNIFTY",ex:"Index",  px:52140.20},
    {sym:"RELIANCE", ex:"NSE",    px:1412.75},
    {sym:"HDFCBANK", ex:"NSE",    px:1668.40},
    {sym:"INFY",     ex:"NSE",    px:1632.40},
    {sym:"TCS",      ex:"NSE",    px:3444.15},
  ];
  inst.forEach(i=>{ i.base=i.px; i.prev=i.px; i.hist=Array.from({length:24},()=>i.px); });

  let selected = 4; // INFY
  const state = { side:"buy", type:"market", qty:50 };

  const rowsEl = document.getElementById("rows");
  const fmt = n => n.toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});

  // build rows
  inst.forEach((it,idx)=>{
    const r = document.createElement("div");
    r.className="row"; r.setAttribute("role","option"); r.tabIndex=0;
    r.setAttribute("aria-selected", idx===selected ? "true":"false");
    r.dataset.idx=idx;
    r.innerHTML =
      '<div><div class="sym">'+it.sym+'</div><div class="ex">'+it.ex+'</div></div>'+
      '<div class="px num" data-px>'+fmt(it.px)+'</div>'+
      '<div class="chg num up" data-chg>+0.00%</div>'+
      '<div class="spark" data-spark></div>';
    r.addEventListener("click",()=>select(idx));
    r.addEventListener("keydown",e=>{
      if(e.key==="Enter"||e.key===" "){e.preventDefault();select(idx);}
      if(e.key==="ArrowDown"){e.preventDefault();focusRow(idx+1);}
      if(e.key==="ArrowUp"){e.preventDefault();focusRow(idx-1);}
    });
    rowsEl.appendChild(r);
  });
  const rowEls = [...rowsEl.children];

  function focusRow(i){ const n=(i+inst.length)%inst.length; rowEls[n].focus(); }

  function sparkPath(hist){
    const w=100,h=26,pad=3;
    const min=Math.min(...hist),max=Math.max(...hist),rng=(max-min)||1;
    const pts=hist.map((v,i)=>{
      const x=(i/(hist.length-1))*w;
      const y=h-pad-((v-min)/rng)*(h-2*pad);
      return [x,y];
    });
    return pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  }
  function drawSpark(idx){
    const el=rowEls[idx].querySelector("[data-spark]");
    const it=inst[idx];
    const up = it.px>=it.base;
    const col = up ? "var(--up)":"var(--down)";
    el.innerHTML =
      '<svg viewBox="0 0 100 26" preserveAspectRatio="none">'+
      '<path d="'+sparkPath(it.hist)+'" fill="none" stroke="'+col+'" stroke-width="1.4" '+
      'stroke-linejoin="round" stroke-linecap="round"/></svg>';
  }

  function select(idx){
    selected=idx;
    rowEls.forEach((r,i)=>r.setAttribute("aria-selected", i===idx?"true":"false"));
    drawSpark(idx);
    syncTicket();
  }

  // ---- price simulation ----
  function tick(){
    inst.forEach((it,idx)=>{
      const drift=(Math.random()-0.5);
      const step=it.base*0.0006*drift + (it.base-it.px)*0.02; // mild mean-reversion
      it.prev=it.px;
      it.px=Math.max(0.05, it.px+step);
      it.hist.push(it.px); if(it.hist.length>24) it.hist.shift();

      const row=rowEls[idx];
      const pxEl=row.querySelector("[data-px]");
      const chgEl=row.querySelector("[data-chg]");
      pxEl.textContent=fmt(it.px);
      const chg=((it.px-it.base)/it.base)*100;
      chgEl.textContent=(chg>=0?"+":"")+chg.toFixed(2)+"%";
      chgEl.className="chg num "+(chg>=0?"up":"down");

      if(!reduce && Math.abs(it.px-it.prev)>0.0001){
        const cls=it.px>it.prev?"flash-up":"flash-down";
        pxEl.classList.remove("flash-up","flash-down"); void pxEl.offsetWidth;
        pxEl.classList.add(cls);
        pxEl.style.color = it.px>it.prev ? "var(--up)":"var(--down)";
        setTimeout(()=>{pxEl.style.color="";},260);
      }
      if(row.getAttribute("aria-selected")==="true") drawSpark(idx);
    });
    if(state.type==="market") syncEstimate();
    updatePlaceLabel();
  }

  // ---- ticket wiring ----
  const selSym=document.getElementById("selSym");
  const qtyEl=document.getElementById("qty");
  const priceEl=document.getElementById("price");
  const priceWrap=document.getElementById("priceWrap");
  const priceHint=document.getElementById("priceHint");
  const estVal=document.getElementById("estVal");
  const buyBtn=document.getElementById("buyBtn");
  const sellBtn=document.getElementById("sellBtn");
  const mktBtn=document.getElementById("mktBtn");
  const lmtBtn=document.getElementById("lmtBtn");
  const place=document.getElementById("place");
  const placeLab=document.getElementById("placeLab");

  function currentPrice(){
    if(state.type==="limit"){ const v=parseFloat(priceEl.value); return isNaN(v)?0:v; }
    return inst[selected].px;
  }
  function syncEstimate(){
    const v=state.qty*currentPrice();
    estVal.textContent="₹"+fmt(v);
  }
  function updatePlaceLabel(){
    const side=state.side==="buy"?"Buy":"Sell";
    placeLab.textContent=side+" "+(state.qty||0)+" "+inst[selected].sym;
    place.disabled = !(state.qty>0) || (state.type==="limit" && currentPrice()<=0);
  }
  function syncTicket(){
    selSym.textContent=inst[selected].sym;
    if(state.type==="market"){ priceEl.value=fmt(inst[selected].px); }
    syncEstimate(); updatePlaceLabel();
  }

  function setSide(s){
    state.side=s;
    buyBtn.dataset.on=s==="buy"; sellBtn.dataset.on=s==="sell";
    document.documentElement.style.setProperty("--side", s==="buy"?"var(--up)":"var(--down)");
    document.documentElement.style.setProperty("--side-dim", s==="buy"?"var(--up-dim)":"var(--down-dim)");
    updatePlaceLabel();
  }
  function setType(t){
    state.type=t;
    mktBtn.dataset.on=t==="market"; lmtBtn.dataset.on=t==="limit";
    const isLimit=t==="limit";
    priceEl.disabled=!isLimit;
    priceWrap.dataset.disabled=!isLimit;
    priceHint.textContent=isLimit?"limit":"at market";
    if(isLimit){ priceEl.value=fmt(inst[selected].px); priceEl.focus(); priceEl.select(); }
    syncEstimate(); updatePlaceLabel();
  }

  buyBtn.onclick=()=>setSide("buy");
  sellBtn.onclick=()=>setSide("sell");
  mktBtn.onclick=()=>setType("market");
  lmtBtn.onclick=()=>setType("limit");

  document.getElementById("qtyMinus").onclick=()=>{ state.qty=Math.max(0,(parseInt(qtyEl.value)||0)-5); qtyEl.value=state.qty; syncEstimate(); updatePlaceLabel(); };
  document.getElementById("qtyPlus").onclick=()=>{ state.qty=(parseInt(qtyEl.value)||0)+5; qtyEl.value=state.qty; syncEstimate(); updatePlaceLabel(); };
  qtyEl.addEventListener("input",()=>{ state.qty=parseInt(qtyEl.value.replace(/\D/g,""))||0; qtyEl.value=state.qty||""; syncEstimate(); updatePlaceLabel(); });
  priceEl.addEventListener("input",()=>{ syncEstimate(); updatePlaceLabel(); });

  // ---- hold-to-confirm ----
  const fill=document.getElementById("fill");
  const HOLD=reduce?300:700;
  let raf=null,start=0,armed=false;

  function beginHold(){
    if(place.disabled) return;
    place.dataset.holding="true"; start=performance.now();
    const loop=(now)=>{
      const p=Math.min(1,(now-start)/HOLD);
      fill.style.width=(p*100)+"%";
      if(p>=1){ commit(); return; }
      raf=requestAnimationFrame(loop);
    };
    raf=requestAnimationFrame(loop);
  }
  function cancelHold(){
    if(raf) cancelAnimationFrame(raf); raf=null;
    place.dataset.holding="false"; fill.style.width="0%";
  }
  function commit(){
    cancelHold();
    const it=inst[selected];
    const px=currentPrice();
    fireToast(state.side, state.qty, it.sym, px);
  }
  place.addEventListener("mousedown",beginHold);
  place.addEventListener("touchstart",e=>{e.preventDefault();beginHold();},{passive:false});
  ["mouseup","mouseleave","touchend","touchcancel"].forEach(ev=>place.addEventListener(ev,cancelHold));

  // keyboard accessible two-step confirm (hold is pointer-only)
  place.addEventListener("keydown",e=>{
    if((e.key==="Enter"||e.key===" ")){
      e.preventDefault();
      if(place.disabled) return;
      if(!armed){ armed=true; placeLab.dataset.prev=placeLab.textContent; placeLab.textContent="Press again to confirm"; fill.style.width="40%"; }
      else { armed=false; commit(); }
    }
  });
  place.addEventListener("blur",()=>{ if(armed){armed=false; fill.style.width="0%"; updatePlaceLabel();} });

  // ---- toast ----
  const toast=document.getElementById("toast");
  const toastMsg=document.getElementById("toastMsg");
  let toastT=null;
  function fireToast(side,qty,sym,px){
    const verb=side==="buy"?"Buy":"Sell";
    toastMsg.innerHTML='<b>'+verb+' '+qty+' '+sym+'</b> placed'+
      '<span class="sub">'+(state.type==="market"?"Market order":"Limit")+' · ₹'+fmt(px)+' · est ₹'+fmt(qty*px)+'</span>';
    toast.dataset.show="true";
    clearTimeout(toastT); toastT=setTimeout(()=>toast.dataset.show="false",3200);
    updatePlaceLabel();
  }

  // ---- init ----
  setSide("buy"); setType("market"); drawSpark(selected); syncTicket();
  setInterval(tick, reduce?2000:1200);
})();
</script>
</body>
